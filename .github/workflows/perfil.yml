# Mantém o perfil vivo:
#  1) atualiza "Atividade recente" no README com seus últimos commits
#  2) gera a cobrinha que come o seu gráfico de contribuições (branch "output")
# Roda a cada 6 horas, a cada push e também manualmente (aba Actions → perfil → Run workflow).
name: perfil

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  atividade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Atualizar atividade recente
        run: node scripts/atividade.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar se mudou
        run: |
          if git diff --quiet README.md; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Atualiza atividade recente"
          git push

  cobrinha:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?palette=github-light&color_snake=#8b5cf6
            dist/cobrinha-dark.svg?palette=github-dark&color_snake=#a78bfa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
