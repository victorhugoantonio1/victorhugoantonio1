# Mantém o perfil vivo: regenera a sala em pixel art (clima, commits, linguagens),
# os números, os cards dos projetos e o painel de atividade.
# Roda a cada 4 horas (o clima muda), a cada push e manualmente (aba Actions → perfil → Run workflow).
name: perfil

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'assets/**']

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  sala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar a sala e os painéis
        run: node scripts/sala.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar se mudou
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nada novo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza a sala"
          git push
